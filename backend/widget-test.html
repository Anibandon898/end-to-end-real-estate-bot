<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropertyPilot AI Widget Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f1e7;
            color: #111;
        }

        .test-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .test-content {
            max-width: 700px;
        }

        .test-content h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .test-content p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
        }

        /* Floating Chat Button */

        #propertypilot-button {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background: #c9a227;
            color: #111;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            z-index: 9999;
            transition: 0.2s;
        }

        #propertypilot-button:hover {
            transform: scale(1.08);
        }

        /* Chat Window */

        #propertypilot-chat {
            position: fixed;
            right: 25px;
            bottom: 105px;
            width: 380px;
            max-width: calc(100vw - 30px);
            height: 600px;
            max-height: calc(100vh - 130px);
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            z-index: 9998;
        }

        #propertypilot-chat.open {
            display: flex;
        }

        /* Header */

        .chat-header {
            background: #111;
            color: white;
            padding: 18px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #c9a227;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .brand-name {
            font-size: 16px;
            font-weight: bold;
        }

        .brand-status {
            font-size: 11px;
            color: #c9a227;
            margin-top: 3px;
        }

        .close-button {
            background: transparent;
            color: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }

        /* New Conversation */

        .new-conversation {
            margin-top: 15px;
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #444;
            background: #1d1d1d;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .new-conversation:hover {
            background: #c9a227;
            color: #111;
            border-color: #c9a227;
        }

        /* Messages */

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            background: #f7f7f7;
        }

        .message {
            display: flex;
            margin-bottom: 14px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 82%;
            padding: 11px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .bot .message-bubble {
            background: white;
            color: #222;
            border: 1px solid #e2e2e2;
            border-bottom-left-radius: 4px;
        }

        .user .message-bubble {
            background: #c9a227;
            color: #111;
            border-bottom-right-radius: 4px;
        }

        .typing {
            font-style: italic;
            color: #777;
        }

        /* Input */

        .chat-input-area {
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }

        #message-input {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 12px;
            outline: none;
            font-size: 14px;
        }

        #message-input:focus {
            border-color: #c9a227;
        }

        #send-button {
            width: 48px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        #send-button:hover {
            background: #c9a227;
            color: #111;
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile */

        @media (max-width: 500px) {
            #propertypilot-chat {
                right: 10px;
                bottom: 90px;
                width: calc(100vw - 20px);
                height: calc(100vh - 120px);
            }

            #propertypilot-button {
                right: 18px;
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="test-page">
        <div class="test-content">
            <h1>PropertyPilot AI</h1>

            <p>
                Your next property starts with a conversation.
            </p>

            <p>
                Click the 💬 button in the bottom-right corner to test
                the PropertyPilot AI real estate assistant.
            </p>
        </div>
    </div>


    <!-- Floating Button -->

    <button id="propertypilot-button" title="Open PropertyPilot AI">
        💬
    </button>


    <!-- Chat Window -->

    <div id="propertypilot-chat">

        <div class="chat-header">

            <div class="header-top">

                <div class="brand">

                    <div class="brand-icon">
                        P
                    </div>

                    <div>
                        <div class="brand-name">
                            PropertyPilot AI
                        </div>

                        <div class="brand-status">
                            ● Online
                        </div>
                    </div>

                </div>

                <button
                    class="close-button"
                    id="close-button"
                    title="Close chat">
                    ×
                </button>

            </div>

            <button
                class="new-conversation"
                id="new-conversation">
                ＋ New Conversation
            </button>

        </div>


        <div
            class="chat-messages"
            id="chat-messages">
        </div>


        <div class="chat-input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                id="send-button">
                ➤
            </button>

        </div>

    </div>


    <script>

        /* =====================================================
           PROPERTY PILOT AI CHAT WIDGET
           ===================================================== */

        const API_URL = "http://127.0.0.1:8000/api/v1/chat";

        const SESSION_KEY = "propertypilot_session";


        const chatButton =
            document.getElementById("propertypilot-button");

        const chatWindow =
            document.getElementById("propertypilot-chat");

        const closeButton =
            document.getElementById("close-button");

        const newConversationButton =
            document.getElementById("new-conversation");

        const messagesContainer =
            document.getElementById("chat-messages");

        const messageInput =
            document.getElementById("message-input");

        const sendButton =
            document.getElementById("send-button");


        /* =====================================================
           SESSION
           ===================================================== */

        function createSessionId() {

            return (
                Date.now().toString() +
                Math.random()
                    .toString(36)
                    .substring(2, 10)
            );
        }


        function getSessionId() {

            let sessionId =
                localStorage.getItem(SESSION_KEY);

            if (!sessionId) {

                sessionId = createSessionId();

                localStorage.setItem(
                    SESSION_KEY,
                    sessionId
                );
            }

            return sessionId;
        }


        function createNewConversation() {

            const newSession =
                createSessionId();

            localStorage.setItem(
                SESSION_KEY,
                newSession
            );

            messagesContainer.innerHTML = "";

            addBotMessage(
                "Welcome! 👋 I'm your PropertyPilot AI real estate assistant.\n\nI can help you find the right property and understand your requirements.\n\nMay I have your name?"
            );

            messageInput.value = "";

            messageInput.focus();
        }


        /* =====================================================
           OPEN / CLOSE CHAT
           ===================================================== */

        chatButton.addEventListener(
            "click",
            function () {

                chatWindow.classList.add("open");

                messageInput.focus();

                if (
                    messagesContainer.children.length === 0
                ) {
                    createNewConversation();
                }
            }
        );


        closeButton.addEventListener(
            "click",
            function () {

                chatWindow.classList.remove("open");

            }
        );


        /* =====================================================
           NEW CONVERSATION
           ===================================================== */

        newConversationButton.addEventListener(
            "click",
            function () {

                const confirmed =
                    confirm(
                        "Start a new conversation?\n\nYour current conversation will be cleared."
                    );

                if (confirmed) {

                    createNewConversation();

                }

            }
        );


        /* =====================================================
           ADD BOT MESSAGE
           ===================================================== */

        function addBotMessage(text) {

            const message =
                document.createElement("div");

            message.className =
                "message bot";

            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";

            bubble.textContent = text;

            message.appendChild(bubble);

            messagesContainer.appendChild(message);

            scrollToBottom();
        }


        /* =====================================================
           ADD USER MESSAGE
           ===================================================== */

        function addUserMessage(text) {

            const message =
                document.createElement("div");

            message.className =
                "message user";

            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";

            bubble.textContent = text;

            message.appendChild(bubble);

            messagesContainer.appendChild(message);

            scrollToBottom();
        }


        /* =====================================================
           TYPING INDICATOR
           ===================================================== */

        function showTyping() {

            const message =
                document.createElement("div");

            message.id = "typing-message";

            message.className =
                "message bot";

            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble typing";

            bubble.textContent =
                "PropertyPilot AI is typing...";

            message.appendChild(bubble);

            messagesContainer.appendChild(message);

            scrollToBottom();
        }


        function removeTyping() {

            const typing =
                document.getElementById(
                    "typing-message"
                );

            if (typing) {
                typing.remove();
            }
        }


        /* =====================================================
           SCROLL
           ===================================================== */

        function scrollToBottom() {

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;
        }


        /* =====================================================
           SEND MESSAGE
           ===================================================== */

        async function sendMessage() {

            const message =
                messageInput.value.trim();

            if (!message) {
                return;
            }


            const sessionId =
                getSessionId();


            addUserMessage(message);

            messageInput.value = "";

            messageInput.disabled = true;

            sendButton.disabled = true;

            showTyping();


            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                session_id:
                                    sessionId,

                                message:
                                    message

                            })
                        }
                    );


                removeTyping();


                if (!response.ok) {

                    throw new Error(
                        "Server returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (data.reply) {

                    addBotMessage(
                        data.reply
                    );

                } else {

                    addBotMessage(
                        "I received your message, but I didn't get a response from the assistant."
                    );

                }


            } catch (error) {

                removeTyping();

                console.error(
                    "PropertyPilot error:",
                    error
                );


                addBotMessage(
                    "I'm having trouble connecting to the assistant right now. Please make sure the FastAPI server is running."
                );

            }


            messageInput.disabled = false;

            sendButton.disabled = false;

            messageInput.focus();

        }


        /* =====================================================
           SEND BUTTON
           ===================================================== */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        /* =====================================================
           ENTER KEY
           ===================================================== */

        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* =====================================================
           STARTUP
           ===================================================== */

        getSessionId();

    </script>

</body>
</html>
