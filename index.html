```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Real Estate Lead Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 650px;
      margin: 50px auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      background: #fdeaea;
      color: #a30000;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Real Estate Lead Bot</h1>

    <p class="subtitle">
      Tell us what property you are looking for.
    </p>

    <form id="realEstateForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="property_type">Property Type</label>
      <select id="property_type" name="property_type" required>
        <option value="">Select property type</option>
        <option value="House">House</option>
        <option value="Apartment">Apartment</option>
        <option value="Land">Land</option>
        <option value="Office">Office</option>
        <option value="Shop">Shop</option>
        <option value="Duplex">Duplex</option>
        <option value="Other">Other</option>
      </select>

      <label for="budget">Budget</label>
      <input
        type="text"
        id="budget"
        name="budget"
        placeholder="e.g. ₦50,000,000"
        required
      >

      <label for="location">Preferred Location</label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="e.g. Uyo"
        required
      >

      <label for="timeline">Purchase Timeline</label>
      <select id="timeline" name="timeline" required>
        <option value="">Select timeline</option>
        <option value="Immediately">Immediately</option>
        <option value="Within 1 month">Within 1 month</option>
        <option value="Within 3 months">Within 3 months</option>
        <option value="Within 6 months">Within 6 months</option>
        <option value="Within 1 year">Within 1 year</option>
        <option value="Just browsing">Just browsing</option>
      </select>

      <label for="message">Additional Information</label>
      <textarea
        id="message"
        name="message"
        placeholder="Tell us anything else about the property you need..."
      ></textarea>

      <button type="submit" id="submitButton">
        Submit Property Request
      </button>

    </form>

    <div id="result"></div>

  </div>

  <script>

    const form = document.getElementById("realEstateForm");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        property_type: document.getElementById("property_type").value,
        budget: document.getElementById("budget").value,
        location: document.getElementById("location").value,
        timeline: document.getElementById("timeline").value,
        message: document.getElementById("message").value
      };

      result.style.display = "block";
      result.className = "";
      result.innerHTML = "Submitting your request...";

      submitButton.disabled = true;

      try {

        const response = await fetch(
          "https://band-eminem-ips-working.trycloudflare.com/webhook/webhook-test/real-estate",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify(data)
          }
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        result.className = "success";

        result.innerHTML =
          "Thank you! Your property request has been submitted successfully.";

        form.reset();

      } catch (error) {

        console.error(error);

        result.className = "error";

        result.innerHTML =
          "Unable to submit your request. Please try again.";

      } finally {

        submitButton.disabled = false;

      }

    });

  </script>

</body>
</html>
```
