```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Lead Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Find Your Property</h1>

    <p>
      Tell us what you are looking for and our team will get back to you.
    </p>

    <form id="realEstateForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="property_type">Property Type</label>
      <select id="property_type" name="property_type" required>
        <option value="">Select property type</option>
        <option value="House">House</option>
        <option value="Apartment">Apartment</option>
        <option value="Land">Land</option>
        <option value="Duplex">Duplex</option>
        <option value="Office">Office</option>
        <option value="Shop">Shop</option>
        <option value="Warehouse">Warehouse</option>
        <option value="Other">Other</option>
      </select>

      <label for="budget">Budget</label>
      <input
        type="text"
        id="budget"
        name="budget"
        placeholder="Example: ₦50,000,000"
        required
      >

      <label for="location">Preferred Location</label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="Example: Uyo"
        required
      >

      <label for="timeline">Timeline</label>
      <select id="timeline" name="timeline" required>
        <option value="">Select timeline</option>
        <option value="Immediately">Immediately</option>
        <option value="1 month">Within 1 month</option>
        <option value="3 months">Within 3 months</option>
        <option value="6 months">Within 6 months</option>
        <option value="1 year">Within 1 year</option>
        <option value="Just researching">Just researching</option>
      </select>

      <label for="message">Tell Us More</label>
      <textarea
        id="message"
        name="message"
        placeholder="Describe the property you are looking for..."
        required
      ></textarea>

      <button type="submit">
        Submit Request
      </button>

    </form>

    <div id="result"></div>

  </div>

  <script>

    document
      .getElementById("realEstateForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const result = document.getElementById("result");

        result.innerHTML = "Submitting your request...";

        const data = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          property_type: document.getElementById("property_type").value,
          budget: document.getElementById("budget").value,
          location: document.getElementById("location").value,
          timeline: document.getElementById("timeline").value,
          message: document.getElementById("message").value
        };

        try {

          const response = await fetch(
            "https://band-eminem-ips-working.trycloudflare.com/webhook-test/real-estate",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify(data)
            }
          );

          if (!response.ok) {
            throw new Error("Server returned an error");
          }

          result.innerHTML =
            "Your request has been submitted successfully!";

          document.getElementById("realEstateForm").reset();

        } catch (error) {

          console.error(error);

          result.innerHTML =
            "Unable to submit your request. Please try again.";

        }

      });

  </script>

</body>
</html>
