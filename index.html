<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Lead Bot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Real Estate Lead Bot</h1>

    <p class="subtitle">
      Tell us what you're looking for and we'll help you find the right property.
    </p>

    <form id="leadForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="property_type">Property Type</label>
      <select id="property_type" name="property_type" required>
        <option value="">Select property type</option>
        <option value="House">House</option>
        <option value="Apartment">Apartment</option>
        <option value="Land">Land</option>
        <option value="Commercial Property">Commercial Property</option>
      </select>

      <label for="budget">Budget</label>
      <input
        type="text"
        id="budget"
        name="budget"
        placeholder="e.g. ₦50,000,000"
        required
      >

      <label for="location">Preferred Location</label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="e.g. Uyo"
        required
      >

      <label for="timeline">Purchase Timeline</label>
      <select id="timeline" name="timeline" required>
        <option value="">Select timeline</option>
        <option value="Immediately">Immediately</option>
        <option value="Within 1 month">Within 1 month</option>
        <option value="1-3 months">1-3 months</option>
        <option value="3-6 months">3-6 months</option>
        <option value="6+ months">6+ months</option>
      </select>

      <label for="message">Additional Information</label>
      <textarea
        id="message"
        name="message"
        placeholder="Tell us anything else about your property needs..."
      ></textarea>

      <button type="submit">
        Submit Property Request
      </button>

    </form>

    <div id="result"></div>

  </div>

  <script>
    const form = document.getElementById("leadForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      result.style.display = "block";
      result.className = "";
      result.innerHTML = "Submitting your request...";

      try {
        const response = await fetch(
          "",const response = await fetch(
  "http://localhost:5678/webhook/webhook-test/real-estate",
  {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
          }
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        result.className = "success";
        result.innerHTML =
          "Thank you! Your property request has been submitted successfully.";

        form.reset();

      } catch (error) {
        result.className = "error";
        result.innerHTML =
          "Something went wrong. Please try again.";

        console.error(error);
      }
    });
  </script>

</body>
</html>
